<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprite Sheet Slicer</title>

<style>
* { box-sizing: border-box; }

body {
    font-family: Inter, system-ui, sans-serif;
    background: #f4f5f7;
    color: #20242c;
    margin: 0;
    padding: 40px 20px;
}

h1 { margin: 0 0 25px; font-size: 28px; font-weight: 700; }

.controls {
    max-width: 900px;
    background: white;
    border: 1px solid #e1e4e8;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 25px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    box-shadow: 0 3px 12px #00000008;
}

.controls label {
    display: flex;
    flex-direction: column;
    gap: 7px;
    font-size: 13px;
    font-weight: 600;
    color: #555e6b;
}

.controls input[type="number"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d9dee5;
    border-radius: 7px;
    background: #fafbfc;
    color: #20242c;
    font-size: 14px;
    outline: none;
}

.controls input[type="number"]:focus {
    border-color: #4f7df3;
    box-shadow: 0 0 0 3px #4f7df320;
}

.controls input[type="file"] {
    grid-column: 1 / -1;
    width: 100%;
    padding: 12px;
    background: #f8f9fb;
    border: 1px dashed #cbd1da;
    border-radius: 8px;
    cursor: pointer;
}

button {
    padding: 10px 15px;
    border: none;
    border-radius: 7px;
    background: #3568df;
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}

button:hover { background: #2855bd; }

#sliceButton { grid-column: 1 / -1; padding: 12px; }

/* ZOOM */

.zoom-controls {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    background: #f8f9fb;
    border: 1px solid #e1e4e8;
    border-radius: 8px;
}

.zoom-controls button { min-width: 40px; }

.zoom-controls input { flex: 1; min-width: 50px; accent-color: #3568df; }

#zoomValue { min-width: 55px; text-align: center; font-size: 13px; font-weight: 700; }

/* VISUALIZAÇÃO */

.canvas-container {
    background: white;
    border: 1px solid #e1e4e8;
    border-radius: 12px;
    padding: 20px;
    overflow: auto;
    min-height: 150px;
    max-width: 100%;
}

.canvas-wrapper {
    position: relative;
    width: fit-content;
    margin: auto;
}

.canvas-wrapper canvas {
    display: block;
    max-width: none;
}

/* Mantém os pixels nítidos ao dar zoom (pixel art) */
#imageCanvas {
    position: absolute;
    top: 0;
    left: 0;
    image-rendering: pixelated;
}

#gridCanvas {
    position: relative;
    pointer-events: none;
}

@media (max-width: 600px) {
    body { padding: 20px 12px; }
    .controls { grid-template-columns: repeat(2, 1fr); padding: 16px; gap: 15px; }
    .zoom-controls { flex-wrap: wrap; }
}
</style>
</head>

<body>

<h1>Sprite Sheet Slicer</h1>

<div class="controls">

    <input type="file" id="spriteFile" accept="image/*">

    <label for="rows">Rows <input type="number" id="rows" value="1" min="1"></label>
    <label for="cols">Columns <input type="number" id="cols" value="1" min="1"></label>
    <label for="gapX">Gap X <input type="number" id="gapX" value="0" min="0"></label>
    <label for="gapY">Gap Y <input type="number" id="gapY" value="0" min="0"></label>
    <label for="marginX">Margin X <input type="number" id="marginX" value="0" min="0"></label>
    <label for="marginY">Margin Y <input type="number" id="marginY" value="0" min="0"></label>

    <div class="zoom-controls">
        <button type="button" id="zoomOut">−</button>
        <input type="range" id="zoomSlider" min="25" max="500" value="100" step="5">
        <button type="button" id="zoomIn">+</button>
        <span id="zoomValue">100%</span>
        <button type="button" id="resetZoom">Reset</button>
    </div>

    <button id="sliceButton">Slice</button>

</div>

<div class="canvas-container" id="canvasContainer">
    <div class="canvas-wrapper">
        <canvas id="imageCanvas"></canvas>
        <canvas id="gridCanvas"></canvas>
    </div>
</div>

<script>

// ELEMENTOS

const fileInput = document.getElementById("spriteFile");

const imageCanvas = document.getElementById("imageCanvas");
const gridCanvas = document.getElementById("gridCanvas");

const imageCtx = imageCanvas.getContext("2d");
const gridCtx = gridCanvas.getContext("2d");

const zoomSlider = document.getElementById("zoomSlider");
const zoomValue = document.getElementById("zoomValue");

const canvasContainer = document.getElementById("canvasContainer");

let spriteImage = new Image();
let zoom = 100;


// CARREGAR IMAGEM

fileInput.addEventListener("change", event => {

    const file = event.target.files[0];

    if (!file) return;

    const url = URL.createObjectURL(file);
    const img = new Image();

    img.onload = () => {

        spriteImage = img;

        // O canvas da imagem mantém a resolução original.
        imageCanvas.width = img.naturalWidth;
        imageCanvas.height = img.naturalHeight;

        URL.revokeObjectURL(url);

        drawImage();
        updateZoom(); // redimensiona o grid e o redesenha

    };

    img.onerror = () => {
        URL.revokeObjectURL(url);
        alert("Não foi possível carregar a imagem.");
    };

    img.src = url;

});


// DESENHAR IMAGEM ORIGINAL

function drawImage() {

    if (!spriteImage.complete || !spriteImage.naturalWidth) return;

    imageCtx.clearRect(0, 0, imageCanvas.width, imageCanvas.height);
    imageCtx.drawImage(spriteImage, 0, 0);

}


// CONTROLE DE ZOOM

function updateZoom() {

    zoomSlider.value = zoom;
    zoomValue.textContent = zoom + "%";

    const scale = zoom / 100;

    const displayWidth = Math.round(imageCanvas.width * scale);
    const displayHeight = Math.round(imageCanvas.height * scale);

    // A imagem é escalada pelo CSS.
    imageCanvas.style.width = displayWidth + "px";
    imageCanvas.style.height = displayHeight + "px";

    // O grid tem o bitmap no tamanho EXIBIDO (1 pixel do canvas = 1 pixel da tela).
    // Assim linhas e textos mantêm tamanho constante e ficam nítidos em qualquer zoom.
    // (Alterar width/height também limpa o canvas.)
    gridCanvas.width = displayWidth;
    gridCanvas.height = displayHeight;
    gridCanvas.style.width = displayWidth + "px";
    gridCanvas.style.height = displayHeight + "px";

    drawGrid();

}


document.getElementById("zoomIn").addEventListener("click", () => {
    zoom = Math.min(500, zoom + 25);
    updateZoom();
});

document.getElementById("zoomOut").addEventListener("click", () => {
    zoom = Math.max(25, zoom - 25);
    updateZoom();
});

zoomSlider.addEventListener("input", () => {
    zoom = Number(zoomSlider.value);
    updateZoom();
});

document.getElementById("resetZoom").addEventListener("click", () => {
    zoom = 100;
    updateZoom();
    canvasContainer.scrollTop = 0;
    canvasContainer.scrollLeft = 0;
});


// DESENHAR GRID

function drawGrid() {

    if (!spriteImage.complete || !spriteImage.naturalWidth) return;

    gridCtx.clearRect(0, 0, gridCanvas.width, gridCanvas.height);

    const rows = Number(document.getElementById("rows").value);
    const cols = Number(document.getElementById("cols").value);

    const gapX = Number(document.getElementById("gapX").value);
    const gapY = Number(document.getElementById("gapY").value);

    const marginX = Number(document.getElementById("marginX").value);
    const marginY = Number(document.getElementById("marginY").value);

    if (
        !Number.isInteger(rows) || rows < 1 ||
        !Number.isInteger(cols) || cols < 1 ||
        ![gapX, gapY, marginX, marginY].every(
            value => Number.isFinite(value) && value >= 0
        )
    ) {
        return;
    }

    const spriteWidth =
        (imageCanvas.width - 2 * marginX - (cols - 1) * gapX) / cols;

    const spriteHeight =
        (imageCanvas.height - 2 * marginY - (rows - 1) * gapY) / rows;

    if (spriteWidth <= 0 || spriteHeight <= 0) return;

    const scale = zoom / 100;

    gridCtx.strokeStyle = "#00ff00";
    gridCtx.lineWidth = 2;

    gridCtx.font = "bold 16px Arial";
    gridCtx.textBaseline = "top";
    gridCtx.textAlign = "left";

    let spriteNumber = 0;

    for (let row = 0; row < rows; row++) {

        for (let col = 0; col < cols; col++) {

            // Coordenadas da imagem -> coordenadas da tela
            const x = (marginX + col * (spriteWidth + gapX)) * scale;
            const y = (marginY + row * (spriteHeight + gapY)) * scale;

            const width = spriteWidth * scale;
            const height = spriteHeight * scale;

            gridCtx.strokeRect(x, y, width, height);

            // NÚMERO

            const text = String(spriteNumber);
            const textX = x + 3;
            const textY = y + 3;

            gridCtx.fillStyle = "black";
            gridCtx.fillRect(
                textX - 2,
                textY - 2,
                gridCtx.measureText(text).width + 6,
                20
            );

            gridCtx.fillStyle = "white";
            gridCtx.fillText(text, textX, textY);

            spriteNumber++;

        }

    }

}


// SLICE

function slice() {
    drawGrid();
}


// ATUALIZAR AUTOMATICAMENTE

document.querySelectorAll('.controls input[type="number"]').forEach(input => {
    input.addEventListener("input", slice);
});

document.getElementById("sliceButton").addEventListener("click", slice);

</script>

</body>
</html>
